[package]
name = "ai-art-agent"
version = "0.1.0"
description = "Desktop shell for AI Art Agent"
authors = ["AI Art Agent contributors"]
edition = "2021"

[lib]
name = "ai_art_agent_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ai-art-agent"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
